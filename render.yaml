# Render Blueprint: one free web service running the single-container image (Dockerfile.render).
# Secrets are NOT in this file: values marked sync:false are entered in the Render dashboard.
# Database: an external PostgreSQL (e.g. Neon); Render's free PostgreSQL expires, so it is not used.
services:
  - type: web
    name: netcoop-ai
    runtime: docker
    plan: free
    region: singapore
    branch: gate0-skeleton
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: NETCOOP_ENV
        value: production
      - key: NETCOOP_DATABASE_URL        # postgresql://USER:PASSWORD@HOST/DB?sslmode=require (Neon "pooled" or direct)
        sync: false
      - key: NETCOOP_AUTH_MODE           # "clerk" for Google sign-in (docs/27); "token" = legacy static token
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY  # Clerk publishable key (pk_...): public, compiled into the React build
        sync: false
      - key: CLERK_SECRET_KEY            # Clerk secret key (sk_...): runtime only, verifies session tokens
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES    # optional; default: this service's URL (+ NETCOOP_CORS_ORIGINS)
        sync: false
      - key: NETCOOP_API_TOKEN           # legacy token mode only; ignored when NETCOOP_AUTH_MODE=clerk
        sync: false
      - key: NETCOOP_CORS_ORIGINS        # the Netlify site origin, e.g. https://netcoop-ai.netlify.app
        sync: false
      - key: NETCOOP_TASK_TIMEOUT_S      # free instances have a small CPU share
        value: "60"
      - key: NETCOOP_LOG_MEMORY_S        # prints RSS of all four processes to the log
        value: "300"
