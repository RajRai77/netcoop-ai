name: ci

on:
  push:
  pull_request:

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.24"
      - run: uv sync --locked
      - run: uv run pytest

  test-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.24"
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run python scripts/run_local.py --check --port auto

  evaluation:
    runs-on: ubuntu-24.04
    needs: test-linux
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.24"
      - run: uv sync --locked
      # Reproducibility check only (dev set, two methods). Held-out benchmarks are run deliberately,
      # after a knowledge freeze, and their result files are committed under eval/.
      - run: uv run python scripts/evaluate.py --sets dev --methods A_threshold D_full --out eval-ci
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: eval-ci/

  test-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: netcoop
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: netcoop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netcoop -d netcoop_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NETCOOP_TEST_DATABASE_URL: postgresql://netcoop:ci-only-password@127.0.0.1:5432/netcoop_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.24"
      - run: uv sync --locked
      # Fail (not skip) if the PostgreSQL variants did not run.
      - run: uv run pytest -m postgres -rs | tee pg.txt
      - run: "! grep -q 'NETCOOP_TEST_DATABASE_URL not set' pg.txt"

  compose-smoke:
    runs-on: ubuntu-24.04
    needs: [test-linux, test-postgres]
    steps:
      - uses: actions/checkout@v4
      - name: Create CI-only env file
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" .env
          sed -i "s/^NETCOOP_API_TOKEN=.*/NETCOOP_API_TOKEN=$(openssl rand -hex 24)/" .env
          sed -i "s/^NETCOOP_AGENT_TOKEN=.*/NETCOOP_AGENT_TOKEN=$(openssl rand -hex 24)/" .env
      - run: docker compose version
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.production.yaml config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 240
      - name: Only the web port is published (agents and DB are internal)
        run: |
          docker compose ps
          for pair in db:5432 agent-performance:8101 agent-infrastructure:8102 agent-connectivity:8103; do
            out=$(docker compose port "${pair%%:*}" "${pair##*:}" 2>/dev/null || true)
            echo "$pair published as: '${out}'"
            case "$out" in *:[1-9]*) echo "internal service is published"; exit 1;; esac
          done
          docker compose port web 8000
      - run: NETCOOP_API_TOKEN=$(grep '^NETCOOP_API_TOKEN=' .env | cut -d= -f2) BASE_URL=http://127.0.0.1:8000 sh scripts/smoke.sh
      - name: Evidence survives container restart
        run: |
          docker compose restart web
          docker compose up -d --wait --wait-timeout 120
          TOKEN=$(grep '^NETCOOP_API_TOKEN=' .env | cut -d= -f2)
          n=$(docker compose exec -T db psql -U netcoop -d netcoop -tAc "select count(*) from observations")
          r=$(docker compose exec -T db psql -U netcoop -d netcoop -tAc "select count(*) from reports")
          echo "observations after restart: $n, reports: $r"; test "$n" -ge 3 && test "$r" -ge 1
      - name: Backup, destroy the volume, restore on a fresh volume
        run: |
          before=$(docker compose exec -T db psql -U netcoop -d netcoop -tAc "select count(*) from reports")
          sh scripts/backup.sh backups/ci.dump
          docker compose down -v
          docker compose up -d --wait --wait-timeout 240 db
          docker compose up -d --no-deps --no-start web || true
          sh scripts/restore.sh backups/ci.dump
          docker compose up -d --wait --wait-timeout 240
          after=$(docker compose exec -T db psql -U netcoop -d netcoop -tAc "select count(*) from reports")
          echo "reports before=$before after restore=$after"; test "$before" = "$after" && test "$after" -ge 1
          TOKEN=$(grep '^NETCOOP_API_TOKEN=' .env | cut -d= -f2)
          iid=$(docker compose exec -T db psql -U netcoop -d netcoop -tAc "select incident_id from reports limit 1" | tr -d ' ')
          curl -sf -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:8000/api/incidents/$iid/report" | grep -q '"incident_id"'
      - name: Readiness drops when DB stops
        run: |
          docker compose stop db
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health/ready)
          echo "ready after db stop: $code"; test "$code" = 503
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down -v
        if: always()

  render-image:
    # Single-container image for Render: API on 0.0.0.0:$PORT, three A2A agents on loopback, React app served.
    runs-on: ubuntu-24.04
    needs: [test-linux]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: netcoop
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: netcoop
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U netcoop" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.render -t netcoop-render .
      - name: Start the container like Render does (PORT injected, external PostgreSQL, API token)
        run: |
          echo "TOKEN=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          . "$GITHUB_ENV"
          docker run -d --name nr -p 10000:10000 --add-host=host.docker.internal:host-gateway \
            -e PORT=10000 -e NETCOOP_ENV=production -e NETCOOP_LOG_MEMORY_S=5 \
            -e NETCOOP_DATABASE_URL=postgresql://netcoop:ci-only-password@host.docker.internal:5432/netcoop \
            -e NETCOOP_API_TOKEN="$TOKEN" netcoop-render
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:10000/health/ready && break; sleep 2; done
          curl -fsS http://127.0.0.1:10000/health/ready
      - name: Only $PORT listens on 0.0.0.0; agents are loopback-only
        run: |
          docker exec nr python -c "
          import sys
          rows=[l.split() for l in open('/proc/net/tcp').read().splitlines()[1:]]
          listen=[(r[1].split(':')[0], int(r[1].split(':')[1],16)) for r in rows if r[3]=='0A']
          print('listening:', listen)
          public=[p for a,p in listen if a!='0100007F']
          sys.exit(0 if public==[10000] and len(listen)>=4 else 1)"
      - name: Auth enforced, React app served on the same origin
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/api/agents)" = 401
          curl -fsS http://127.0.0.1:10000/ | grep -q "NetCoop AI"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/command)" = 200
      - run: NETCOOP_API_TOKEN="$TOKEN" BASE_URL=http://127.0.0.1:10000 sh scripts/smoke.sh
      - name: Memory of the four processes on Linux (Render free = 512 MB)
        run: |
          sleep 6
          docker logs nr 2>&1 | grep "memory RSS" | tail -3
          docker stats --no-stream --format "container {{.Name}}: {{.MemUsage}}" nr
      - name: Logs on failure
        if: failure()
        run: docker logs nr
