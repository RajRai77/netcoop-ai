[project]
name = "netcoop"
version = "0.0.1"
description = "NetCoop AI - evidence-first multi-agent network fault diagnosis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "jsonschema>=4.23",
    "a2a-sdk[http-server]>=1.3,<1.4",
    "networkx>=3.4,<4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "jsonschema>=4.23",
]

[project.scripts]
netcoop = "netcoop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netcoop"]

# Ship the NDEP contract files inside the wheel (used by containers / non-editable installs).
[tool.hatch.build.targets.wheel.force-include]
"spec" = "netcoop/_spec"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "postgres: needs a reachable PostgreSQL via NETCOOP_TEST_DATABASE_URL (skipped otherwise)",
]
