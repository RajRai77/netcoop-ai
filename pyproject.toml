[project]
name = "netcoop"
version = "0.0.1"
description = "NetCoop AI - evidence-first multi-agent network fault diagnosis (Gate 0 skeleton)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netcoop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "postgres: needs a reachable PostgreSQL via NETCOOP_TEST_DATABASE_URL (skipped otherwise)",
]
